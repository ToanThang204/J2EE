<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xl);">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <div style="text-align: center; margin-bottom: var(--spacing-xl);">
                <h1>Thanh toán</h1>
                <p th:if="${payment != null}" style="color: var(--medium-grey);">
                    Mã giao dịch: <strong th:text="${payment.id}">Payment ID</strong>
                </p>
            </div>
            
            <div th:if="${payment != null}">
                <div class="form-layout">
                    <div class="form-group">
                        <label class="form-label">Số tiền</label>
                        <div style="font-size: var(--font-size-2xl); font-weight: 700; color: var(--primary-green);">
                            <span th:text="${payment.amount != null ? #numbers.formatDecimal(payment.amount, 0, 'POINT', 0, 'POINT') : '0'}">0</span>
                            <span th:text="${payment.currency != null ? payment.currency : 'VND'}">VND</span>
                        </div>
                    </div>
                    
                    <div class="form-group" th:if="${payment.description != null}">
                        <label class="form-label">Mô tả</label>
                        <p th:text="${payment.description}">Description</p>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Trạng thái</label>
                        <span class="status-badge" 
                              th:classappend="${payment.status != null and payment.status == 'paid' ? 'approved' : 'pending'}"
                              th:text="${payment.status != null ? payment.status : 'N/A'}">Status</span>
                    </div>
                    
                    <div class="form-group" th:if="${payment.sepayQrUrl != null}">
                        <label class="form-label">QR Code thanh toán</label>
                        <div style="text-align: center; padding: var(--spacing-lg); background-color: var(--light-grey); border-radius: var(--radius-md);">
                            <img th:src="${payment.sepayQrUrl}" alt="QR Code" style="max-width: 300px; height: auto;">
                        </div>
                        <p style="text-align: center; color: var(--medium-grey); font-size: var(--font-size-sm); margin-top: var(--spacing-md);">
                            Quét mã QR để thanh toán
                        </p>
                    </div>
                    
                    <div class="form-group" th:if="${payment.expiredAt != null}">
                        <label class="form-label">Hạn thanh toán</label>
                        <p th:text="${#temporals.format(payment.expiredAt, 'dd-MM-yyyy HH:mm')}">Expiration date</p>
                    </div>
                </div>
                
                <div class="action-buttons" style="margin-top: var(--spacing-xl);">
                    <button class="btn btn-primary" onclick="checkPaymentStatus()">Kiểm tra trạng thái</button>
                    <a href="/employer/payment" class="btn btn-secondary">Quay lại</a>
                </div>
            </div>
            
            <div th:if="${payment == null}" class="empty-state">
                <div class="empty-state-icon">💳</div>
                <h3 class="empty-state-title">Không tìm thấy giao dịch</h3>
                <p class="empty-state-message">Giao dịch không tồn tại hoặc đã bị xóa.</p>
            </div>
        </div>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script>
        const paymentId = /*[[${payment != null ? payment.id : null}]]*/ null;
        
        async function checkPaymentStatus() {
            if (!paymentId) return;
            
            try {
                const response = await api.get('/api/payment/' + paymentId);
                if (response && response.success && response.data) {
                    const payment = response.data;
                    if (payment.status === 'paid') {
                        showToast('Thanh toán thành công!', 'success');
                        setTimeout(() => window.location.reload(), 1000);
                    } else {
                        showToast('Giao dịch chưa được thanh toán', 'info');
                    }
                }
            } catch (error) {
                showToast('Lỗi khi kiểm tra trạng thái', 'error');
            }
        }
        
        // Auto check payment status every 5 seconds if pending
        if (paymentId) {
            const paymentStatus = /*[[${payment != null ? payment.status : null}]]*/ null;
            if (paymentStatus === 'pending') {
                setInterval(checkPaymentStatus, 5000);
            }
        }
    </script>
</body>
</html>
