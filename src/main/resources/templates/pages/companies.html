<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách công ty - WebCV</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/components.css}" rel="stylesheet">
    <link th:href="@{/css/home.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <main class="main-content">
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">Danh sách công ty</h1>
                <p class="hero-subtitle">Khám phá các công ty hàng đầu đang tuyển dụng</p>
            </div>
        </section>
        
        <!-- Search Section -->
        <section class="section">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" 
                           id="searchInput" 
                           class="search-input" 
                           placeholder="Tìm kiếm công ty...">
                    <button class="btn btn-primary" onclick="searchCompanies()">
                        <i class="fas fa-search"></i> Tìm kiếm
                    </button>
                </div>
            </div>
            
            <!-- Filter Tags -->
            <div class="filter-section">
                <span class="filter-label">Lọc theo:</span>
                <div class="filter-tags">
                    <button class="filter-tag active" data-filter="">Tất cả</button>
                    <button class="filter-tag" data-filter="tech">Công nghệ</button>
                    <button class="filter-tag" data-filter="finance">Tài chính</button>
                    <button class="filter-tag" data-filter="education">Giáo dục</button>
                    <button class="filter-tag" data-filter="healthcare">Y tế</button>
                </div>
            </div>
        </section>
        
        <!-- Companies Grid -->
        <section class="section">
            <div class="companies-grid" id="companiesGrid">
                <th:block th:each="company : ${companies}">
                    <div class="company-card" th:onclick="'window.location.href=\'/companies/' + ${company.id} + '\''">
                        <div class="company-logo" th:text="${company.companyName != null ? company.companyName.substring(0, 1).toUpperCase() : 'C'}">
                        </div>
                        <h3 class="company-name" th:text="${company.companyName}">Company Name</h3>
                        <p class="company-desc" th:text="${company.description != null ? (company.description.length() > 80 ? company.description.substring(0, 80) + '...' : company.description) : 'Chưa có mô tả'}">
                            Company description
                        </p>
                        <div class="company-info">
                            <span th:if="${company.status != null and company.status.name() == 'APPROVED'}">
                                <i class="fas fa-check-circle" style="color: #28a745;"></i>
                                Đã xác minh
                            </span>
                        </div>
                    </div>
                </th:block>
            </div>
            
            <!-- Empty State -->
            <div th:if="${companies == null or companies.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">🏢</div>
                <h3 class="empty-state-title">Không tìm thấy công ty nào</h3>
                <p class="empty-state-message">Hãy thử tìm kiếm với từ khóa khác.</p>
            </div>
        </section>
    </main>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script>
        function searchCompanies() {
            const searchTerm = document.getElementById('searchInput').value;
            if (searchTerm) {
                window.location.href = '/pages/companies?search=' + encodeURIComponent(searchTerm);
            } else {
                window.location.href = '/pages/companies';
            }
        }
    </script>
</body>
</html>
