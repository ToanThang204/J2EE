<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận đơn ứng tuyển mới</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #3B82F6;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }
        .content {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 0 0 8px 8px;
        }
        .button {
            display: inline-block;
            background-color: #3B82F6;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 20px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>WebCV</h1>
    </div>
    <div class="content">
        <h2>Bạn có đơn ứng tuyển mới</h2>
        <p>Xin chào <span th:text="${employerName != null ? employerName : 'Nhà tuyển dụng'}">Nhà tuyển dụng</span>,</p>
        <p>Bạn vừa nhận được một đơn ứng tuyển mới cho vị trí <strong th:text="${jobTitle != null ? jobTitle : 'N/A'}">Job Title</strong>.</p>
        <p><strong>Thông tin ứng viên:</strong></p>
        <ul>
            <li>Tên: <span th:text="${candidateName != null ? candidateName : 'N/A'}">Candidate Name</span></li>
            <li>Email: <span th:text="${candidateEmail != null ? candidateEmail : 'N/A'}">candidate@example.com</span></li>
        </ul>
        <a th:href="${applicationUrl != null ? applicationUrl : '#'}" class="button">Xem đơn ứng tuyển</a>
        <p>Trân trọng,<br>Đội ngũ WebCV</p>
    </div>
    <div class="footer">
        <p>Email này được gửi tự động, vui lòng không trả lời.</p>
    </div>
</body>
</html>
