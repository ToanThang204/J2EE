<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - WebCV' : 'WebCV'}">WebCV</title>
    
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- CSS -->
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/components.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/footer.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
    <link th:href="@{/css/home.css}" rel="stylesheet">
    <th:block th:if="${pageStyle != null}">
        <link th:href="@{'/css/' + ${pageStyle} + '.css'}" rel="stylesheet">
    </th:block>
</head>
<body>
    <!-- Header -->
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <!-- Sidebar (if needed) -->
        <aside th:if="${showSidebar != null and showSidebar}" 
               th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <!-- Main Content -->
        <main class="main-content" th:classappend="${showSidebar != null and showSidebar ? 'with-sidebar' : ''}">
            <div th:replace="${content}"></div>
        </main>
    </div>
    
    <!-- Footer -->
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <!-- JavaScript -->
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <th:block th:if="${pageScript != null}">
        <script th:src="@{'/js/modules/' + ${pageScript} + '.js'}"></script>
    </th:block>
</body>
</html>
