<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="header" class="main-header">
        <div class="header-container">
            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" style="display: none;">☰</button>
            
            <!-- Logo -->
            <div class="header-logo">
                <a th:href="@{/}">
                    <span class="logo-text">WebCV</span>
                </a>
            </div>
            
            <!-- Navigation -->
            <nav class="header-nav" style="display: none;">
                <a th:href="@{/jobs}" class="nav-link">Tạo CV</a>
                <a th:href="@{/jobs}" class="nav-link">Công ty</a>
            </nav>
            
            <!-- Right Section -->
            <div class="header-right">
                <!-- Notification and Favorite Badges -->
                <div class="header-badges" style="display: none;">
                    <div class="header-badge favorite" title="Việc làm đã lưu">
                        <span>❤️</span>
                        <span class="badge-count" id="favoriteCount">0</span>
                    </div>
                    <div class="header-badge" title="Thông báo" onclick="window.location.href='/notifications'">
                        <span>🔔</span>
                        <span class="badge-count" id="notificationCount">0</span>
                    </div>
                </div>
                
                <!-- Upgrade Button (for candidates) -->
                <a th:href="@{/employer/upgrade}" 
                   class="btn-upgrade"
                   style="display: none;">
                    Nâng cấp lên Nhà tuyển dụng
                </a>
                
                <!-- User Profile -->
                <div class="user-profile" style="display: none;">
                    <div class="user-avatar">
                        <span class="avatar-icon">👤</span>
                    </div>
                    <div class="user-info">
                        <span class="user-name">User Name</span>
                        <span class="user-role">Role</span>
                    </div>
                    <div class="user-dropdown">
                        <a th:href="@{/candidate/profile}" class="profile-link-candidate">Hồ sơ</a>
                        <a th:href="@{/employer/profile}" class="profile-link-employer">Hồ sơ</a>
                        <a th:href="@{/admin/dashboard}" class="profile-link-admin">Dashboard</a>
                        <a href="#" onclick="logout(); return false;">Đăng xuất</a>
                    </div>
                </div>
                
                <!-- Login/Register (if not authenticated) -->
                <div class="auth-buttons">
                    <a th:href="@{/login}" class="btn-login">Đăng nhập</a>
                    <a th:href="@{/register}" class="btn-register">Đăng ký</a>
                </div>
            </div>
        </div>
        
        <!-- Mobile Menu Overlay -->
        <div class="mobile-menu-overlay" id="mobileMenuOverlay" onclick="toggleMobileMenu()"></div>
        </div>
    </header>
    
    <!-- Header Auth Script -->
    <script th:src="@{/js/shared/header.js}"></script>
</body>
</html>
