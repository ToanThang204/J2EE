<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <aside th:fragment="sidebar" class="sidebar sidebar-light">

        <nav class="sidebar-nav">
            <!-- Admin Sidebar -->
            <div class="sidebar-nav-admin" style="display: none;">
                <a href="/admin/dashboard" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-th-large"></i></span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="/admin/companies" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-building"></i></span>
                    <span class="nav-text">Tất cả công ty</span>
                </a>
                <a href="/admin/companies-pending" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-clock"></i></span>
                    <span class="nav-text">Công ty chờ duyệt</span>
                    <span class="nav-badge" th:if="${pendingCompaniesCount > 0}"
                        th:text="${pendingCompaniesCount}">14</span>
                </a>
                <a href="/admin/payments-pending" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-credit-card"></i></span>
                    <span class="nav-text">Thanh toán chờ duyệt</span>
                </a>
                <a href="/admin/revenue-report" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-chart-line"></i></span>
                    <span class="nav-text">Báo cáo doanh thu</span>
                </a>
                <a href="/admin/users" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-users"></i></span>
                    <span class="nav-text">Quản lý User</span>
                </a>
                <a href="/admin/categories" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-tags"></i></span>
                    <span class="nav-text">Danh mục ngành nghề</span>
                </a>
            </div>

            <!-- Employer Sidebar -->
            <div class="sidebar-nav-employer" style="display: none;">
                <a href="/employer/company/info" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-building"></i></span>
                    <span class="nav-text">Thông tin công ty</span>
                </a>
                <a href="/employer/profile" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-user-circle"></i></span>
                    <span class="nav-text">Thông tin cá nhân</span>
                </a>
                <a href="/employer/jobs" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-briefcase"></i></span>
                    <span class="nav-text">Quản lý việc làm</span>
                </a>
                <a href="/employer/applications" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-file-alt"></i></span>
                    <span class="nav-text">Quản lý ứng tuyển</span>
                </a>
                <a href="/employer/messages" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-comment-alt"></i></span>
                    <span class="nav-text">Tin nhắn</span>
                </a>
            </div>

            <!-- Candidate Sidebar -->
            <div class="sidebar-nav-candidate" style="display: none;">
                <a href="/candidate/profile" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-user"></i></span>
                    <span class="nav-text">Hồ sơ</span>
                </a>
                <a href="/candidate/cv-index" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-file-alt"></i></span>
                    <span class="nav-text">Quản lý CV</span>
                </a>
                <a href="/candidate/applied-jobs" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-file-invoice"></i></span>
                    <span class="nav-text">Đơn ứng tuyển</span>
                </a>
                <a href="/candidate/saved-jobs" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-heart"></i></span>
                    <span class="nav-text">Việc làm đã lưu</span>
                </a>
                <a th:href="@{/candidate/messages}" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-comment-alt"></i></span>
                    <span class="nav-text">Tin nhắn</span>
                </a>
            </div>
        </nav>

        <!-- Sidebar Authentication Script -->
        <script th:src="@{/js/shared/sidebar.js}"></script>
    </aside>
</body>

</html>
