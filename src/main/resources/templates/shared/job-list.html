<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách việc làm - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/cards.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xl);">
        <h1 style="margin-bottom: var(--spacing-lg);">Danh sách việc làm</h1>
        
        <!-- Search and Filter -->
        <div class="search-filter-section">
            <div class="search-box">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" 
                           id="searchInput" 
                           placeholder="Tìm kiếm theo tiêu đề..." 
                           class="form-input">
                </div>
                <button class="btn btn-primary" onclick="searchJobs()">Tìm kiếm</button>
            </div>
        </div>
        
        <!-- Jobs Grid -->
        <div class="jobs-grid" id="jobsGrid">
            <div th:each="job : ${jobs}" class="job-card" th:onclick="'window.location.href=\'/jobs/' + ${job.id} + '\''">
                <div class="job-card-header">
                    <div class="company-logo-small" th:text="${job.company != null ? job.company.name.substring(0, 2).toUpperCase() : 'CO'}">
                        CO
                    </div>
                    <div class="company-name-small" th:text="${job.company != null ? job.company.name : 'Company'}">
                        Company Name
                    </div>
                </div>
                
                <h3 class="job-title" th:text="${job.title}">Job Title</h3>
                
                <div class="job-meta">
                    <div class="job-meta-item">
                        <span>📍</span>
                        <span th:text="${job.location != null ? job.location : 'N/A'}">Location</span>
                    </div>
                    <div class="job-meta-item">
                        <span>📅</span>
                        <span th:text="${job.expirationDate != null ? 'Hạn nộp: ' + ${#temporals.format(job.expirationDate, 'dd-MM-yyyy')} : 'N/A'}">
                            Deadline
                        </span>
                    </div>
                </div>
                
                <div class="job-footer">
                    <div style="display: flex; gap: var(--spacing-sm); align-items: center;">
                        <span class="salary-badge" th:text="${job.salaryRange != null ? job.salaryRange : 'Cạnh tranh'}">
                            Salary
                        </span>
                        <span class="ai-tag">AI</span>
                    </div>
                    <div class="favorite-icon" th:onclick="'event.stopPropagation(); toggleFavorite(' + ${job.id} + ')'">
                        ❤️
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${jobs == null or jobs.isEmpty()}" class="empty-state">
            <div class="empty-state-icon">💼</div>
            <h3 class="empty-state-title">Không tìm thấy việc làm nào</h3>
            <p class="empty-state-message">Hãy thử tìm kiếm với từ khóa khác hoặc điều chỉnh bộ lọc.</p>
        </div>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <!-- Scroll to Top Button -->
    <button class="scroll-to-top-btn" id="scrollToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="Lên đầu trang">
        ↑
    </button>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script>
        function searchJobs() {
            const searchTerm = document.getElementById('searchInput').value;
            if (searchTerm) {
                window.location.href = '/jobs?search=' + encodeURIComponent(searchTerm);
            }
        }
        
        function toggleFavorite(jobId) {
            // TODO: Implement favorite toggle
            console.log('Toggle favorite for job:', jobId);
        }
        
        // Scroll to top button
        window.addEventListener('scroll', function() {
            const scrollBtn = document.getElementById('scrollToTop');
            if (scrollBtn) {
                if (window.pageYOffset > 300) {
                    scrollBtn.classList.add('show');
                } else {
                    scrollBtn.classList.remove('show');
                }
            }
        });
    </script>
</body>
</html>
