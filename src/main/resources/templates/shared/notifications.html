<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/footer.css}" rel="stylesheet">
    <link th:href="@{/css/shared/sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .notifications-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            margin-top: 20px;
        }

        .notification-item {
            padding: 20px;
            border-bottom: 1px solid #f1f1f1;
            display: flex;
            gap: 15px;
            transition: background 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .notification-item:hover {
            background: #f8fafc;
        }

        .notification-item.unread {
            background: #f0fdf4;
            border-left: 4px solid #5cb85c;
        }

        .notification-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #e6f4ea;
            color: #5cb85c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .notification-body {
            font-size: 14px;
            color: #718096;
            line-height: 1.5;
        }

        .notification-time {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 8px;
        }

        .actions-bar {
            padding: 15px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>

    <div class="main-container" style="background-color: #f5f7fa; min-height: calc(100vh - 80px);">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>

        <main class="main-content with-sidebar" style="padding: 30px;">
            <div class="section-title-bar"
                style="background: #5cb85c; color: white; padding: 12px 20px; border-radius: 4px; margin-bottom: 24px; font-weight: 500;">
                Thông báo của bạn
            </div>

            <div class="notifications-container">
                <div class="actions-bar">
                    <span style="font-weight: 600; color: #4a5568;">Tất cả thông báo</span>
                    <button class="btn btn-sm" onclick="markAllAsRead()"
                        style="font-size: 13px; color: #5cb85c; background: none; border: none; font-weight: 600; cursor: pointer;">Đánh
                        dấu đã đọc tất cả</button>
                </div>

                <div id="notificationsList">
                    <!-- Placeholder for notifications -->
                    <div class="empty-state" style="padding: 100px 20px; text-align: center;">
                        <i class="fas fa-bell-slash"
                            style="font-size: 60px; color: #cbd5e0; margin-bottom: 20px; display: block;"></i>
                        <h3 style="color: #4a5568;">Bạn chưa có thông báo nào</h3>
                        <p style="color: #718096; font-size: 14px;">Chúng tôi sẽ thông báo cho bạn khi có cập nhật mới!
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>

    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await api.get('/notifications');
                if (response.success && response.data && response.data.content) {
                    renderNotifications(response.data.content);
                }
            } catch (error) {
                console.error('Error fetching notifications:', error);
            }
        });

        function renderNotifications(notifications) {
            const list = document.getElementById('notificationsList');
            if (!notifications || notifications.length === 0) return;

            list.innerHTML = notifications.map(notif => `
                <a href="${notif.link || '#'}" class="notification-item ${notif.read ? '' : 'unread'}" onclick="markAsRead(${notif.id})">
                    <div class="notification-icon">
                        <i class="${getIconForType(notif.type)}"></i>
                    </div>
                    <div class="notification-content">
                        <div class="notification-title">${notif.title}</div>
                        <div class="notification-body">${notif.message}</div>
                        <div class="notification-time">${new Date(notif.createdAt).toLocaleString('vi-VN')}</div>
                    </div>
                </a>
            `).join('');
        }

        async function markAsRead(id) {
            try {
                await api.post(`/notifications/${id}/read`);
            } catch (e) { console.error(e); }
        }

        async function markAllAsRead() {
            try {
                const response = await api.post('/notifications/read-all');
                if (response.success) location.reload();
            } catch (e) { console.error(e); }
        }

        function getIconForType(type) {
            switch (type) {
                case 'APPLICATION': return 'fas fa-file-alt';
                case 'MESSAGE': return 'fas fa-comment';
                case 'SYSTEM': return 'fas fa-cog';
                default: return 'fas fa-bell';
            }
        }
    </script>
</body>

</html>
