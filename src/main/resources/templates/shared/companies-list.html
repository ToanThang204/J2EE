<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách công ty - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/cards.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xl);">
        <h1 style="margin-bottom: var(--spacing-lg);">Danh sách công ty</h1>
        
        <!-- Search and Filter -->
        <div class="search-filter-section">
            <div class="search-box">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" 
                           id="searchInput" 
                           placeholder="Tìm kiếm theo tên công ty..." 
                           class="form-input">
                </div>
                <button class="btn btn-primary" onclick="searchCompanies()">Tìm kiếm</button>
            </div>
        </div>
        
        <!-- Companies Grid -->
        <div class="jobs-grid" id="companiesGrid">
            <div th:each="company : ${companies}" 
                 class="job-card" 
                 th:onclick="'window.location.href=\'/companies/' + ${company.id} + '\''">
                <div class="job-card-header">
                    <div class="company-logo-small" 
                         th:text="${company.companyName != null ? company.companyName.substring(0, 2).toUpperCase() : 'CO'}"
                         style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%); color: white;">
                        CO
                    </div>
                    <div class="company-name-small" th:text="${company.companyName}">
                        Company Name
                    </div>
                </div>
                
                <h3 class="job-title" th:text="${company.companyName}">Company Name</h3>
                
                <div class="job-meta">
                    <div class="job-meta-item">
                        <span>📍</span>
                        <span th:text="${company.address != null ? company.address : 'N/A'}">Location</span>
                    </div>
                    <div class="job-meta-item">
                        <span>📧</span>
                        <span th:text="${company.email != null ? company.email : 'N/A'}">
                            Email
                        </span>
                    </div>
                </div>
                <div class="job-footer">
                    <div style="display: flex; gap: var(--spacing-sm); align-items: center;">
                        <span class="salary-badge" 
                              th:text="${company.status != null ? company.status : 'Active'}"
                              style="background-color: #28a745;">
                            Status
                        </span>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${companies == null or companies.isEmpty()}" class="empty-state">
            <div class="empty-state-icon">🏢</div>
            <h3 class="empty-state-title">Không tìm thấy công ty nào</h3>
            <p class="empty-state-message">Hãy thử tìm kiếm với từ khóa khác hoặc điều chỉnh bộ lọc.</p>
        </div>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <!-- Scroll to Top Button -->
    <button class="scroll-to-top-btn" id="scrollToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="Lên đầu trang">
        ↑
    </button>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script>
        function searchCompanies() {
            const searchTerm = document.getElementById('searchInput').value;
            if (searchTerm) {
                window.location.href = '/companies?search=' + encodeURIComponent(searchTerm);
            }
        }
        
        // Scroll to Top Button
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('scrollToTop');
            if (window.pageYOffset > 300) {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
