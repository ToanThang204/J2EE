<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý AI Feedback - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="admin-header">
                <h1>Quản lý AI Feedback</h1>
            </div>
            
            <div class="card">
                <div class="section-header-flex">
                    <h2 class="section-title">Danh sách feedback từ AI</h2>
                    <div class="action-buttons">
                        <input type="text" id="searchInput" class="form-input" placeholder="Tìm kiếm..." style="max-width: 300px;">
                        <button class="btn btn-primary" onclick="searchFeedback()">Tìm kiếm</button>
                    </div>
                </div>
                
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Người dùng</th>
                                <th>Loại</th>
                                <th>Nội dung</th>
                                <th>Điểm số</th>
                                <th>Ngày tạo</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="feedback : ${aiFeedbacks}">
                                <td th:text="${feedback.id}">1</td>
                                <td th:text="${feedback.user != null ? feedback.user.name : 'N/A'}">User Name</td>
                                <td>
                                    <span class="badge badge-info" th:text="${feedback.type != null ? feedback.type : 'N/A'}">MATCH</span>
                                </td>
                                <td th:text="${feedback.content != null ? (feedback.content.length() > 50 ? feedback.content.substring(0, 50) + '...' : feedback.content) : 'N/A'}">Content</td>
                                <td th:text="${feedback.score != null ? feedback.score : 'N/A'}">85</td>
                                <td th:text="${feedback.createdAt != null ? #temporals.format(feedback.createdAt, 'dd-MM-yyyy') : 'N/A'}">01-01-2024</td>
                                <td>
                                    <div class="action-cell">
                                        <button class="btn-icon view" onclick="viewFeedback(/*[[${feedback.id}]]*/)" title="Xem chi tiết">👁️</button>
                                        <button class="btn-icon delete" onclick="deleteFeedback(/*[[${feedback.id}]]*/)" title="Xóa">🗑️</button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${aiFeedbacks == null or aiFeedbacks.isEmpty()}">
                                <td colspan="7" class="empty-state">
                                    <div class="empty-state-icon">🤖</div>
                                    <p class="empty-state-message">Chưa có feedback nào</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script>
        function searchFeedback() {
            const searchTerm = document.getElementById('searchInput').value;
            window.location.href = '/admin/ai-feedback?search=' + encodeURIComponent(searchTerm);
        }
        
        function viewFeedback(feedbackId) {
            window.location.href = '/admin/ai-feedback/' + feedbackId;
        }
        
        async function deleteFeedback(feedbackId) {
            if (confirm('Bạn có chắc chắn muốn xóa feedback này?')) {
                try {
                    const response = await api.delete('/api/admin/ai-feedback/' + feedbackId);
                    if (response && response.success) {
                        showToast('Xóa feedback thành công', 'success');
                        setTimeout(() => window.location.reload(), 1000);
                    }
                } catch (error) {
                    showToast('Lỗi khi xóa feedback', 'error');
                }
            }
        }
    </script>
</body>
</html>
