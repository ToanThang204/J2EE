<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công ty chờ duyệt - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="admin-header">
                <h1>Công ty chờ duyệt</h1>
                <a href="/admin/companies" class="btn btn-secondary">Xem tất cả</a>
            </div>
            
            <div class="card">
                <div class="section-header-flex">
                    <h2 class="section-title">Danh sách công ty chờ duyệt</h2>
                </div>
                
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên công ty</th>
                                <th>Email</th>
                                <th>Người đăng ký</th>
                                <th>Ngày đăng ký</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="company : ${pendingCompanies}">
                                <td th:text="${company.id}">1</td>
                                <td th:text="${company.companyName}">Company Name</td>
                                <td th:text="${company.email != null ? company.email : 'N/A'}">email@example.com</td>
                                <td th:text="${company.user != null ? company.user.name : 'N/A'}">User Name</td>
                                <td th:text="${company.createdAt != null ? #temporals.format(company.createdAt, 'dd-MM-yyyy') : 'N/A'}">01-01-2024</td>
                                <td>
                                    <div class="action-cell">
                                        <button class="btn btn-primary" th:onclick="'approveCompany(' + ${company.id} + ')'">Duyệt</button>
                                        <button class="btn btn-secondary" th:onclick="'viewCompany(' + ${company.id} + ')'">Xem</button>
                                        <button class="btn-icon delete" th:onclick="'rejectCompany(' + ${company.id} + ')'" title="Từ chối">❌</button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${pendingCompanies == null or pendingCompanies.isEmpty()}">
                                <td colspan="6" class="empty-state">
                                    <div class="empty-state-icon">✅</div>
                                    <p class="empty-state-message">Không có công ty nào chờ duyệt</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
    <script>
        async function approveCompany(companyId) {
            if (confirm('Bạn có chắc chắn muốn duyệt công ty này?')) {
                try {
                    const response = await api.put('/companies/' + companyId + '/approve', {});
                    if (response && response.success) {
                        showToast('Duyệt công ty thành công! Role đã được nâng cấp thành EMPLOYER', 'success');
                        setTimeout(() => window.location.reload(), 1000);
                    }
                } catch (error) {
                    showToast('Lỗi khi duyệt công ty: ' + (error.message || 'Unknown error'), 'error');
                    console.error('Error approving company:', error);
                }
            }
        }
        
        async function rejectCompany(companyId) {
            if (confirm('Bạn có chắc chắn muốn từ chối công ty này?')) {
                try {
                    const response = await api.put('/companies/' + companyId + '/reject', {});
                    if (response && response.success) {
                        showToast('Từ chối công ty thành công', 'success');
                        setTimeout(() => window.location.reload(), 1000);
                    }
                } catch (error) {
                    showToast('Lỗi khi từ chối công ty: ' + (error.message || 'Unknown error'), 'error');
                    console.error('Error rejecting company:', error);
                }
            }
        }
        
        function viewCompany(companyId) {
            window.location.href = '/companies/' + companyId;
        }
    </script>
</body>
</html>
