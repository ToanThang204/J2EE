<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="admin-header">
                <h1>Quản lý danh mục</h1>
                <button class="btn btn-primary" onclick="createCategory()">+ Thêm danh mục</button>
            </div>
            
            <div class="card">
                <div class="section-header-flex">
                    <h2 class="section-title">Danh sách danh mục</h2>
                </div>
                
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên danh mục</th>
                                <th>Mô tả</th>
                                <th>Ngày tạo</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="category : ${categories}">
                                <td th:text="${category.id}">1</td>
                                <td th:text="${category.name}">Category Name</td>
                                <td th:text="${category.description != null ? category.description : 'N/A'}">Description</td>
                                <td th:text="${category.createdAt != null ? #temporals.format(category.createdAt, 'dd-MM-yyyy') : 'N/A'}">01-01-2024</td>
                                <td>
                                    <div class="action-cell">
                                        <button class="btn-icon edit" onclick="editCategory(/*[[${category.id}]]*/)" title="Chỉnh sửa">✏️</button>
                                        <button class="btn-icon delete" onclick="deleteCategory(/*[[${category.id}]]*/)" title="Xóa">🗑️</button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${categories == null or categories.isEmpty()}">
                                <td colspan="5" class="empty-state">
                                    <div class="empty-state-icon">📁</div>
                                    <p class="empty-state-message">Chưa có danh mục nào</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script>
        function createCategory() {
            window.location.href = '/admin/categories/create';
        }
        
        function editCategory(categoryId) {
            window.location.href = '/admin/categories/' + categoryId + '/edit';
        }
        
        async function deleteCategory(categoryId) {
            if (confirm('Bạn có chắc chắn muốn xóa danh mục này?')) {
                try {
                    const response = await api.delete('/api/admin/categories/' + categoryId);
                    if (response && response.success) {
                        showToast('Xóa danh mục thành công', 'success');
                        setTimeout(() => window.location.reload(), 1000);
                    }
                } catch (error) {
                    showToast('Lỗi khi xóa danh mục', 'error');
                }
            }
        }
    </script>
</body>
</html>
