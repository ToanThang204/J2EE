<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Industry Contexts - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="admin-header">
                <h1>Quản lý Industry Contexts</h1>
                <button class="btn btn-primary" onclick="createIndustryContext()">+ Thêm Industry Context</button>
            </div>
            
            <div class="card">
                <div class="section-header-flex">
                    <h2 class="section-title">Danh sách Industry Contexts</h2>
                </div>
                
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên ngành</th>
                                <th>Mô tả</th>
                                <th>Ngày tạo</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="context : ${industryContexts}">
                                <td th:text="${context.id}">1</td>
                                <td th:text="${context.industryName}">Industry Name</td>
                                <td th:text="${context.description != null ? (context.description.length() > 50 ? context.description.substring(0, 50) + '...' : context.description) : 'N/A'}">Description</td>
                                <td th:text="${context.createdAt != null ? #temporals.format(context.createdAt, 'dd-MM-yyyy') : 'N/A'}">01-01-2024</td>
                                <td>
                                    <div class="action-cell">
                                        <button class="btn-icon edit" onclick="editIndustryContext(/*[[${context.id}]]*/)" title="Chỉnh sửa">✏️</button>
                                        <button class="btn-icon delete" onclick="deleteIndustryContext(/*[[${context.id}]]*/)" title="Xóa">🗑️</button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${industryContexts == null or industryContexts.isEmpty()}">
                                <td colspan="5" class="empty-state">
                                    <div class="empty-state-icon">🏭</div>
                                    <p class="empty-state-message">Chưa có industry context nào</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
    <script>
        function createIndustryContext() {
            window.location.href = '/admin/industry-contexts/create';
        }
        
        function editIndustryContext(contextId) {
            window.location.href = '/admin/industry-contexts/' + contextId + '/edit';
        }
        
        async function deleteIndustryContext(contextId) {
            if (confirm('Bạn có chắc chắn muốn xóa industry context này?')) {
                try {
                    const response = await api.delete('/api/admin/industry-contexts/' + contextId);
                    if (response && response.success) {
                        showToast('Xóa industry context thành công', 'success');
                        setTimeout(() => window.location.reload(), 1000);
                    }
                } catch (error) {
                    showToast('Lỗi khi xóa industry context', 'error');
                }
            }
        }
    </script>
</body>
</html>
