<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý User - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/admin/admin.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>

        <main class="main-content with-sidebar">
            <div class="admin-header">
                <h1>Quản lý User</h1>
                <div class="admin-user-info">
                    <div class="user-meta">
                        <span class="admin-user-name"
                            th:text="${currentUser != null ? currentUser.user.name : 'Admin'}">Admin</span>
                        <span class="admin-user-role">Quản trị viên</span>
                    </div>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Đăng xuất
                    </button>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="filter-card">
                <div class="filter-group">
                    <input type="text" id="searchInput" class="filter-input" placeholder="Tìm kiếm theo tên, email...">
                    <select id="roleFilter" class="filter-select">
                        <option value="">Tất cả role</option>
                        <option value="CANDIDATE">Ứng viên</option>
                        <option value="EMPLOYER">Nhà tuyển dụng</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                    <select id="statusFilter" class="filter-select">
                        <option value="">Tất cả trạng thái</option>
                        <option value="ACTIVE">Hoạt động</option>
                        <option value="SUSPENDED">Tạm ngưng</option>
                    </select>
                </div>
                <button class="btn-filter" onclick="applyFilters()">
                    <i class="fas fa-search"></i> Lọc
                </button>
            </div>

            <!-- User List -->
            <div class="admin-card">
                <div class="section-header-flex">
                    <h2 class="section-title">Danh sách User (<span th:text="${users.size()}">0</span> user)</h2>
                </div>

                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Trạng thái</th>
                                <th>Ngày tạo</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td>
                                    <div class="name-cell">
                                        <div class="admin-avatar gray">
                                            <i class="fas fa-user"></i>
                                        </div>
                                        <div>
                                            <span class="name-main" th:text="${user.name}">User Name</span>
                                            <span class="id-sub" th:text="'ID: ' + ${user.id}">ID: 9</span>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${user.email}">user@gmail.com</td>
                                <td>
                                    <span class="role-badge"
                                        th:classappend="${user.role != null ? user.role.name().toLowerCase() : ''}"
                                        th:text="${user.role != null ? (user.role.name() == 'CANDIDATE' ? 'Ứng viên' : (user.role.name() == 'EMPLOYER' ? 'Nhà tuyển dụng' : 'Admin')) : 'N/A'}">
                                        Ứng viên
                                    </span>
                                </td>
                                <td>
                                    <span
                                        th:text="${user.status != null and user.status.name() == 'ACTIVE' ? 'Hoạt động' : 'Tạm ngưng'}">Hoạt
                                        động</span>
                                </td>
                                <td>
                                    <div th:if="${user.createdAt != null}">
                                        <div th:text="${#temporals.format(user.createdAt, 'd/MM/yyyy')}">3/10/2025</div>
                                        <div class="name-sub" th:text="${#temporals.format(user.createdAt, 'HH:mm')}">
                                            16:09</div>
                                    </div>
                                </td>
                                <td>
                                    <div class="action-cell">
                                        <a th:href="@{/admin/users/{id}(id=${user.id})}" class="action-btn view"
                                            title="Xem chi tiết">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <button class="action-btn toggle" th:data-user-id="${user.id}"
                                            th:data-status="${user.status != null ? user.status.name() : 'ACTIVE'}"
                                            onclick="toggleUserStatusClick(this)"
                                            th:title="${user.status != null and user.status.name() == 'ACTIVE' ? 'Tạm ngưng' : 'Kích hoạt'}">
                                            <i
                                                th:class="${user.status != null and user.status.name() == 'ACTIVE' ? 'fas fa-pause' : 'fas fa-play'}"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${users == null or users.isEmpty()}">
                                <td colspan="6" style="text-align: center; padding: 40px; color: #a0aec0;">
                                    Chưa có người dùng nào
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
    <script>
        function logout() {
            window.location.href = '/logout';
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value;
            const role = document.getElementById('roleFilter').value;
            const status = document.getElementById('statusFilter').value;

            let url = '/admin/users?';
            if (search) url += 'search=' + encodeURIComponent(search) + '&';
            if (role) url += 'role=' + role + '&';
            if (status) url += 'status=' + status;

            window.location.href = url;
        }

        function toggleUserStatusClick(button) {
            const userId = button.getAttribute('data-user-id');
            const currentStatus = button.getAttribute('data-status');
            toggleUserStatus(userId, currentStatus);
        }

        async function toggleUserStatus(userId, currentStatus) {
            const action = currentStatus === 'ACTIVE' ? 'suspend' : 'activate';
            const actionText = currentStatus === 'ACTIVE' ? 'tạm ngưng' : 'kích hoạt';

            if (confirm(`Bạn có chắc chắn muốn ${actionText} tài khoản này?`)) {
                try {
                    const response = await api.put('/users/' + userId + '/' + action, {});
                    if (response && response.success) {
                        location.reload();
                    }
                } catch (error) {
                    console.error('Error toggling user status:', error);
                }
            }
        }
    </script>
</body>

</html>
