<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="admin-header">
                <h1>Quản lý người dùng</h1>
            </div>
            
            <div class="card">
                <div class="section-header-flex">
                    <h2 class="section-title">Danh sách người dùng</h2>
                    <div class="action-buttons">
                        <input type="text" id="searchInput" class="form-input" placeholder="Tìm kiếm..." style="max-width: 300px;">
                        <button class="btn btn-primary" onclick="searchUsers()">Tìm kiếm</button>
                    </div>
                </div>
                
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên</th>
                                <th>Email</th>
                                <th>Vai trò</th>
                                <th>Trạng thái</th>
                                <th>Ngày tạo</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}">1</td>
                                <td th:text="${user.name}">User Name</td>
                                <td th:text="${user.email}">user@example.com</td>
                                <td>
                                    <span class="badge badge-primary" th:text="${user.role != null ? user.role.name() : 'N/A'}">CANDIDATE</span>
                                </td>
                                <td>
                                    <span class="status-badge" 
                                          th:classappend="${user.status != null and user.status.name() == 'ACTIVE' ? 'approved' : 'pending'}"
                                          th:text="${user.status != null ? user.status.name() : 'N/A'}">ACTIVE</span>
                                </td>
                                <td th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'dd-MM-yyyy') : 'N/A'}">01-01-2024</td>
                                <td>
                                    <div class="action-cell">
                                        <button class="btn-icon view" th:onclick="'viewUser(' + ${user.id} + ')'" title="Xem chi tiết">👁️</button>
                                        <button class="btn-icon edit" th:onclick="'editUser(' + ${user.id} + ')'" title="Chỉnh sửa">✏️</button>
                                        <button class="btn-icon" 
                                                th:classappend="${user.status != null and user.status.name() == 'ACTIVE' ? 'delete' : 'approve'}"
                                                th:data-user-id="${user.id}"
                                                th:data-status="${user.status != null ? user.status.name() : 'ACTIVE'}"
                                                onclick="toggleUserStatusClick(this)"
                                                th:title="${user.status != null and user.status.name() == 'ACTIVE' ? 'Tạm ngưng' : 'Kích hoạt'}">
                                            <span th:text="${user.status != null and user.status.name() == 'ACTIVE' ? '⏸️' : '▶️'}">⏸️</span>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${users == null or users.isEmpty()}">
                                <td colspan="7" class="empty-state">
                                    <div class="empty-state-icon">👥</div>
                                    <p class="empty-state-message">Chưa có người dùng nào</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
    <script>
        function searchUsers() {
            const searchTerm = document.getElementById('searchInput').value;
            window.location.href = '/admin/users?search=' + encodeURIComponent(searchTerm);
        }
        
        function viewUser(userId) {
            window.location.href = '/admin/users/' + userId;
        }
        
        function editUser(userId) {
            window.location.href = '/admin/users/' + userId + '/edit';
        }
        
        function toggleUserStatusClick(button) {
            const userId = button.getAttribute('data-user-id');
            const currentStatus = button.getAttribute('data-status');
            toggleUserStatus(userId, currentStatus);
        }
        
        async function toggleUserStatus(userId, currentStatus) {
            const action = currentStatus === 'ACTIVE' ? 'suspend' : 'activate';
            const actionText = currentStatus === 'ACTIVE' ? 'tạm ngưng' : 'kích hoạt';
            
            if (confirm(`Bạn có chắc chắn muốn ${actionText} tài khoản này?`)) {
                try {
                    const response = await api.put('/users/' + userId + '/' + action, {});
                    if (response && response.success) {
                        showToast(`${actionText.charAt(0).toUpperCase() + actionText.slice(1)} tài khoản thành công`, 'success');
                        setTimeout(() => window.location.reload(), 1000);
                    }
                } catch (error) {
                    showToast('Lỗi khi ' + actionText + ' tài khoản: ' + (error.message || 'Unknown error'), 'error');
                    console.error('Error toggling user status:', error);
                }
            }
        }
    </script>
</body>
</html>
