<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý công ty - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/admin/admin.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>

        <main class="main-content with-sidebar">
            <div class="admin-header">
                <h1>Quản lý công ty</h1>
                <div class="admin-user-info">
                    <div class="user-meta">
                        <span class="admin-user-name"
                            th:text="${currentUser != null ? currentUser.user.name : 'System Admin'}">System
                            Admin</span>
                        <span class="admin-user-role">Quản trị viên</span>
                    </div>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Đăng xuất
                    </button>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="filter-card">
                <div class="filter-group">
                    <input type="text" id="searchInput" class="filter-input"
                        placeholder="Tìm kiếm tên công ty, email...">
                    <select id="statusFilter" class="filter-select">
                        <option value="">Tất cả trạng thái</option>
                        <option value="ACTIVE">Hoạt động</option>
                        <option value="PENDING">Chờ duyệt</option>
                        <option value="REJECTED">Từ chối</option>
                    </select>
                </div>
                <button class="btn-filter" onclick="applyFilters()">
                    <i class="fas fa-search"></i> Lọc
                </button>
                <a href="/admin/companies-pending" class="btn-view-all"
                    style="margin-left: 10px; background-color: #f6ad55;">
                    <i class="fas fa-clock"></i> Chờ duyệt
                </a>
            </div>

            <!-- Company List -->
            <div class="admin-card">
                <div class="section-header-flex">
                    <h2 class="section-title">Danh sách công ty (<span th:text="${companies.size()}">0</span>)</h2>
                </div>

                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Công ty</th>
                                <th>Email</th>
                                <th>Trạng thái</th>
                                <th>Ngày tạo</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="company : ${companies}">
                                <td>
                                    <div class="name-cell">
                                        <div class="admin-avatar gray">
                                            <i class="fas fa-building"></i>
                                        </div>
                                        <div>
                                            <span class="name-main" th:text="${company.companyName}">Company Name</span>
                                            <span class="id-sub" th:text="'ID: ' + ${company.id}">ID: 1</span>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${company.email != null ? company.email : 'N/A'}">email@example.com</td>
                                <td>
                                    <span class="status-badge"
                                        th:classappend="${company.status != null ? company.status.name().toLowerCase() : 'pending'}"
                                        th:text="${company.status != null ? (company.status.name() == 'ACTIVE' ? 'Hoạt động' : (company.status.name() == 'PENDING' ? 'Chờ duyệt' : 'Từ chối')) : 'Chờ duyệt'}">
                                        Hoạt động
                                    </span>
                                </td>
                                <td>
                                    <div th:if="${company.createdAt != null}">
                                        <div th:text="${#temporals.format(company.createdAt, 'd/MM/yyyy')}">3/10/2025
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="action-cell">
                                        <button class="action-btn view"
                                            th:onclick="'viewCompany(' + ${company.id} + ')'" title="Xem chi tiết">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        <button th:if="${company.status != null && company.status.name() == 'PENDING'}"
                                            class="action-btn toggle" style="background-color: #5cb85c;"
                                            th:onclick="'approveCompany(' + ${company.id} + ')'" title="Duyệt">
                                            <i class="fas fa-check"></i>
                                        </button>
                                        <button class="action-btn toggle" style="background-color: #e53e3e;"
                                            th:onclick="'deleteCompany(' + ${company.id} + ')'" title="Xóa">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${companies == null or companies.isEmpty()}">
                                <td colspan="5" style="text-align: center; padding: 40px; color: #a0aec0;">
                                    Chưa có công ty nào
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
    <script>
        function logout() {
            window.location.href = '/logout';
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value;
            const status = document.getElementById('statusFilter').value;
            window.location.href = `/admin/companies?search=${encodeURIComponent(search)}&status=${status}`;
        }

        function viewCompany(id) {
            window.location.href = '/companies/' + id;
        }

        async function approveCompany(id) {
            if (confirm('Duyệt công ty này?')) {
                try {
                    const response = await api.put('/companies/' + id + '/approve', {});
                    if (response && response.success) location.reload();
                } catch (e) { console.error(e); }
            }
        }

        async function deleteCompany(id) {
            if (confirm('Xóa công ty này?')) {
                try {
                    const response = await api.delete('/companies/' + id);
                    if (response && response.success) location.reload();
                } catch (e) { console.error(e); }
            }
        }
    </script>
</body>

</html>
