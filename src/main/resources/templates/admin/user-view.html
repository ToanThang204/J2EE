<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết người dùng - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="admin-header">
                <h1>Chi tiết người dùng</h1>
                <div class="admin-header-actions">
                    <a href="/admin/users" class="btn btn-secondary">Quay lại</a>
                    <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-primary">Chỉnh sửa</a>
                </div>
            </div>
            
            <div class="card">
                <div class="user-detail">
                    <div class="detail-row">
                        <label>ID:</label>
                        <span th:text="${user.id}">1</span>
                    </div>
                    <div class="detail-row">
                        <label>Tên:</label>
                        <span th:text="${user.name}">User Name</span>
                    </div>
                    <div class="detail-row">
                        <label>Email:</label>
                        <span th:text="${user.email}">email@example.com</span>
                    </div>
                    <div class="detail-row">
                        <label>Vai trò:</label>
                        <span class="badge badge-primary" th:text="${user.role != null ? user.role.name() : 'N/A'}">CANDIDATE</span>
                    </div>
                    <div class="detail-row">
                        <label>Trạng thái:</label>
                        <span class="status-badge" 
                              th:classappend="${user.status != null and user.status.name() == 'ACTIVE' ? 'approved' : 'pending'}"
                              th:text="${user.status != null ? user.status.name() : 'N/A'}">ACTIVE</span>
                    </div>
                    <div class="detail-row">
                        <label>Ngày tạo:</label>
                        <span th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'dd-MM-yyyy HH:mm:ss') : 'N/A'}">01-01-2024</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
</body>
</html>
