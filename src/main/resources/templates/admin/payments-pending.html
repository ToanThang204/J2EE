<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán chờ duyệt - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/admin/admin.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>

        <main class="main-content with-sidebar">
            <div class="admin-header">
                <h1>Thanh toán chờ duyệt</h1>
                <div class="admin-user-info">
                    <div class="user-meta">
                        <span class="admin-user-name"
                            th:text="${currentUser != null ? currentUser.user.name : 'System Admin'}">System
                            Admin</span>
                        <span class="admin-user-role">Quản trị viên</span>
                    </div>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Đăng xuất
                    </button>
                </div>
            </div>

            <!-- List of Pending Payments -->
            <div class="admin-card">
                <div class="section-header-flex">
                    <h2 class="section-title">Danh sách chờ xử lý (<span
                            th:text="${pendingPayments != null ? pendingPayments.size() : 0}">0</span>)</h2>
                </div>

                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Người dùng</th>
                                <th>Công ty</th>
                                <th>Số tiền</th>
                                <th>Mô tả</th>
                                <th>Ngày tạo</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="payment : ${pendingPayments}">
                                <td>
                                    <div class="name-cell">
                                        <div class="admin-avatar gray"><i class="fas fa-user"></i></div>
                                        <span class="name-main"
                                            th:text="${payment.user != null ? payment.user.name : 'N/A'}">User
                                            Name</span>
                                    </div>
                                </td>
                                <td style="font-weight: 600;"
                                    th:text="${payment.company != null ? payment.company.companyName : 'N/A'}">Company
                                    Name</td>
                                <td style="color: #f6ad55; font-weight: 700;"
                                    th:text="${payment.amount != null ? #numbers.formatDecimal(payment.amount, 0, 'COMMA', 0, 'POINT') + ' ' + payment.currency : 'N/A'}">
                                    1.000.000 VND</td>
                                <td th:text="${payment.description != null ? payment.description : 'N/A'}">Mô tả</td>
                                <td
                                    th:text="${payment.createdAt != null ? #temporals.format(payment.createdAt, 'dd-MM-yyyy HH:mm') : 'N/A'}">
                                    01-01-2024</td>
                                <td>
                                    <div class="action-cell">
                                        <button class="action-btn view"
                                            th:onclick="'viewPayment(' + ${payment.id} + ')'" title="Xem chi tiết">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        <button class="action-btn toggle" style="background-color: #5cb85c;"
                                            th:onclick="'approvePayment(' + ${payment.id} + ')'" title="Duyệt">
                                            <i class="fas fa-check"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${pendingPayments == null or pendingPayments.isEmpty()}">
                                <td colspan="6" style="text-align: center; padding: 40px; color: #a0aec0;">
                                    Không có thanh toán nào chờ xử lý
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
    <script>
        function logout() {
            window.location.href = '/logout';
        }

        function viewPayment(id) {
            window.location.href = '/payment/' + id;
        }

        async function approvePayment(id) {
            if (confirm('Phê duyệt giao dịch này?')) {
                try {
                    const response = await api.put('/admin/payments/' + id + '/approve', {});
                    if (response && response.success) location.reload();
                } catch (e) {
                    console.error('Error approving payment:', e);
                }
            }
        }
    </script>
</body>

</html>
