<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán chờ duyệt - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="admin-header">
                <h1>Thanh toán chờ duyệt</h1>
            </div>
            
            <div class="card">
                <div class="section-header-flex">
                    <h2 class="section-title">Danh sách thanh toán chờ xử lý</h2>
                </div>
                
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Người dùng</th>
                                <th>Công ty</th>
                                <th>Số tiền</th>
                                <th>Mô tả</th>
                                <th>Ngày tạo</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="payment : ${pendingPayments}">
                                <td th:text="${payment.id}">1</td>
                                <td th:text="${payment.user != null ? payment.user.name : 'N/A'}">User Name</td>
                                <td th:text="${payment.company != null ? payment.company.companyName : 'N/A'}">Company Name</td>
                                <td th:text="${payment.amount != null ? payment.amount + ' ' + payment.currency : 'N/A'}">1000000 VND</td>
                                <td th:text="${payment.description != null ? payment.description : 'N/A'}">Description</td>
                                <td th:text="${payment.createdAt != null ? #temporals.format(payment.createdAt, 'dd-MM-yyyy') : 'N/A'}">01-01-2024</td>
                                <td>
                                    <div class="action-cell">
                                        <button class="btn btn-primary" onclick="viewPayment(/*[[${payment.id}]]*/)">Xem chi tiết</button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${pendingPayments == null or pendingPayments.isEmpty()}">
                                <td colspan="7" class="empty-state">
                                    <div class="empty-state-icon">💳</div>
                                    <p class="empty-state-message">Không có thanh toán nào chờ xử lý</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script>
        function viewPayment(paymentId) {
            window.location.href = '/payment/' + paymentId;
        }
    </script>
</body>
</html>
