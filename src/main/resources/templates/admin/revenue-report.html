<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo doanh thu - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="admin-header">
                <h1>Báo cáo doanh thu</h1>
                <div class="action-buttons">
                    <select id="periodSelect" class="form-input" onchange="loadReport()">
                        <option value="today">Hôm nay</option>
                        <option value="week">Tuần này</option>
                        <option value="month" selected>Tháng này</option>
                        <option value="year">Năm nay</option>
                    </select>
                </div>
            </div>
            
            <!-- Summary Cards -->
            <div class="summary-cards">
                <div class="summary-card">
                    <div class="summary-card-icon green">💰</div>
                    <div class="summary-card-content">
                        <div class="summary-card-number" id="totalRevenue">0</div>
                        <div class="summary-card-label">Tổng doanh thu</div>
                    </div>
                </div>
                
                <div class="summary-card">
                    <div class="summary-card-icon blue">💳</div>
                    <div class="summary-card-content">
                        <div class="summary-card-number" id="totalPayments">0</div>
                        <div class="summary-card-label">Tổng số giao dịch</div>
                    </div>
                </div>
                
                <div class="summary-card">
                    <div class="summary-card-icon orange">✅</div>
                    <div class="summary-card-content">
                        <div class="summary-card-number" id="successfulPayments">0</div>
                        <div class="summary-card-label">Giao dịch thành công</div>
                    </div>
                </div>
                
                <div class="summary-card">
                    <div class="summary-card-icon purple">⏳</div>
                    <div class="summary-card-content">
                        <div class="summary-card-number" id="pendingPayments">0</div>
                        <div class="summary-card-label">Giao dịch chờ xử lý</div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="section-header-flex">
                    <h2 class="section-title">Chi tiết giao dịch</h2>
                </div>
                
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Người dùng</th>
                                <th>Công ty</th>
                                <th>Số tiền</th>
                                <th>Trạng thái</th>
                                <th>Ngày thanh toán</th>
                            </tr>
                        </thead>
                        <tbody id="paymentsTableBody">
                            <tr>
                                <td colspan="6" class="empty-state">
                                    <div class="empty-state-icon">📊</div>
                                    <p class="empty-state-message">Đang tải dữ liệu...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script>
        async function loadReport() {
            const period = document.getElementById('periodSelect').value;
            try {
                const response = await api.get('/api/admin/revenue-report?period=' + period);
                if (response && response.success && response.data) {
                    const data = response.data;
                    document.getElementById('totalRevenue').textContent = formatCurrency(data.totalRevenue || 0);
                    document.getElementById('totalPayments').textContent = data.totalPayments || 0;
                    document.getElementById('successfulPayments').textContent = data.successfulPayments || 0;
                    document.getElementById('pendingPayments').textContent = data.pendingPayments || 0;
                    
                    // Update table
                    const tbody = document.getElementById('paymentsTableBody');
                    if (data.payments && data.payments.length > 0) {
                        tbody.innerHTML = data.payments.map(payment => `
                            <tr>
                                <td>${payment.id}</td>
                                <td>${payment.user ? payment.user.name : 'N/A'}</td>
                                <td>${payment.company ? payment.company.companyName : 'N/A'}</td>
                                <td>${formatCurrency(payment.amount)} ${payment.currency || 'VND'}</td>
                                <td><span class="status-badge ${payment.status === 'paid' ? 'approved' : 'pending'}">${payment.status}</span></td>
                                <td>${payment.paidAt ? new Date(payment.paidAt).toLocaleDateString('vi-VN') : 'N/A'}</td>
                            </tr>
                        `).join('');
                    } else {
                        tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><div class="empty-state-icon">📊</div><p class="empty-state-message">Không có dữ liệu</p></td></tr>';
                    }
                }
            } catch (error) {
                console.error('Error loading report:', error);
                showToast('Lỗi khi tải báo cáo', 'error');
            }
        }
        
        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN').format(amount);
        }
        
        // Load on page load
        document.addEventListener('DOMContentLoaded', loadReport);
    </script>
</body>
</html>
