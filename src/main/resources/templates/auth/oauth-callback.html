<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang xử lý đăng nhập...</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        .callback-container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 1.5rem;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h2 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }
        
        p {
            color: #666;
            font-size: 0.95rem;
        }
        
        .error-message {
            color: #e74c3c;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="spinner"></div>
        <h2>Đang xử lý đăng nhập</h2>
        <p>Vui lòng đợi trong giây lát...</p>
        <p class="error-message" id="errorMessage"></p>
    </div>
    
    <script>
        // Get token from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const needsProfile = urlParams.get('needsProfile') === 'true';
        
        if (token) {
            // Save token to localStorage
            localStorage.setItem('token', token);
            console.log('OAuth: Token saved to localStorage');
            
            // Redirect to homepage or profile setup
            setTimeout(() => {
                if (needsProfile) {
                    window.location.replace('/candidate/profile');
                } else {
                    window.location.replace('/');
                }
            }, 500);
        } else {
            // Show error if no token
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorMessage').textContent = 'Đăng nhập thất bại. Vui lòng thử lại.';
            
            setTimeout(() => {
                window.location.replace('/login');
            }, 2000);
        }
    </script>
</body>
</html>
