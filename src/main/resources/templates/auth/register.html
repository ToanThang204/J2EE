<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/components/login.css}" rel="stylesheet">
    <link th:href="@{/css/components/register.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <!-- Left Panel - Green -->
        <div class="auth-left-panel">
            <div class="logo">WebCV</div>
            <div class="welcome-message">Tham gia cộng đồng tìm việc làm lớn nhất Việt Nam</div>
            <ul class="benefits-list">
                <li class="benefit-item">
                    <div class="benefit-icon">✓</div>
                    <span>Tìm việc làm phù hợp</span>
                </li>
                <li class="benefit-item">
                    <div class="benefit-icon">✓</div>
                    <span>Tạo CV chuyên nghiệp</span>
                </li>
                <li class="benefit-item">
                    <div class="benefit-icon">✓</div>
                    <span>Kết nối với nhà tuyển dụng</span>
                </li>
                <li class="benefit-item">
                    <div class="benefit-icon">✓</div>
                    <span>Cơ hội nghề nghiệp tốt nhất</span>
                </li>
            </ul>
        </div>
        
        <!-- Right Panel - White Form -->
        <div class="auth-right-panel">
            <div class="auth-form-card">
                <h1 class="auth-form-title">Đăng ký tài khoản</h1>
                <p class="auth-form-subtitle">Tạo tài khoản miễn phí để bắt đầu tìm việc</p>
                
                <form class="auth-form" id="registerForm">
                    <div class="form-group">
                        <label for="name" class="form-label">Họ và tên <span style="color: var(--red)">*</span></label>
                        <input type="text" 
                               id="name" 
                               name="name" 
                               class="form-input" 
                               placeholder="Nhập họ và tên"
                               required>
                        <div class="error-message" id="nameError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Email <span style="color: var(--red)">*</span></label>
                        <input type="email" 
                               id="email" 
                               name="email" 
                               class="form-input" 
                               placeholder="phamquanghieu100804@gmail.com"
                               required>
                        <div class="error-message" id="emailError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Mật khẩu <span style="color: var(--red)">*</span></label>
                        <input type="password" 
                               id="password" 
                               name="password" 
                               class="form-input" 
                               placeholder="••••••••"
                               required>
                        <div class="error-message" id="passwordError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="passwordConfirmation" class="form-label">Xác nhận mật khẩu <span style="color: var(--red)">*</span></label>
                        <input type="password" 
                               id="passwordConfirmation" 
                               name="passwordConfirmation" 
                               class="form-input" 
                               placeholder="••••••••"
                               required>
                        <div class="error-message" id="passwordConfirmationError"></div>
                    </div>
                    
                    <button type="submit" class="btn-auth btn-auth-primary">
                        <span>👤</span>
                        + Đăng ký ngay
                    </button>
                </form>
                
                <div class="auth-footer-link">
                    Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
                </div>
            </div>
        </div>
    </div>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/auth.js}"></script>
</body>
</html>
