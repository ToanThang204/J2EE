<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/components/login.css}" rel="stylesheet">
    <link th:href="@{/css/components/forgot-password.css}" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <!-- Left Panel - Green -->
        <div class="auth-left-panel">
            <div class="logo">WebCV</div>
            <div class="welcome-message">Quên mật khẩu?</div>
            <p>Chúng tôi sẽ gửi email hướng dẫn bạn đặt lại mật khẩu.</p>
        </div>
        
        <!-- Right Panel - White Form -->
        <div class="auth-right-panel">
            <div class="auth-form-card">
                <h1 class="auth-form-title">Quên mật khẩu</h1>
                <p class="auth-form-subtitle">Nhập email của bạn để nhận link đặt lại mật khẩu</p>
                
                <form class="auth-form" id="forgotPasswordForm" th:action="@{/api/auth/forgot-password}" method="post">
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" 
                               id="email" 
                               name="email" 
                               class="form-input" 
                               placeholder="Nhập email của bạn"
                               required>
                        <div class="error-message" id="emailError"></div>
                    </div>
                    
                    <button type="submit" class="btn-auth btn-auth-primary">
                        Gửi email
                        <span>→</span>
                    </button>
                </form>
                
                <div class="auth-footer-link">
                    Nhớ mật khẩu? <a th:href="@{/login}">Đăng nhập ngay</a>
                </div>
            </div>
        </div>
    </div>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/auth.js}"></script>
</body>
</html>
