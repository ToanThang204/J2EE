<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/components/login.css}" rel="stylesheet">
    <link th:href="@{/css/components/reset-password.css}" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <!-- Left Panel - Green -->
        <div class="auth-left-panel">
            <div class="logo">WebCV</div>
            <div class="welcome-message">Đặt lại mật khẩu</div>
            <p>Nhập mật khẩu mới cho tài khoản của bạn.</p>
        </div>
        
        <!-- Right Panel - White Form -->
        <div class="auth-right-panel">
            <div class="auth-form-card">
                <h1 class="auth-form-title">Đặt lại mật khẩu</h1>
                <p class="auth-form-subtitle">Nhập mật khẩu mới của bạn</p>
                
                <form class="auth-form" id="resetPasswordForm" th:action="@{/api/auth/reset-password}" method="post">
                    <input type="hidden" id="token" name="token" th:value="${token}">
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" 
                               id="email" 
                               name="email" 
                               class="form-input" 
                               placeholder="Nhập email của bạn"
                               required>
                        <div class="error-message" id="emailError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Mật khẩu mới</label>
                        <input type="password" 
                               id="password" 
                               name="password" 
                               class="form-input" 
                               placeholder="••••••••"
                               required>
                        <div class="error-message" id="passwordError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="passwordConfirmation" class="form-label">Xác nhận mật khẩu</label>
                        <input type="password" 
                               id="passwordConfirmation" 
                               name="passwordConfirmation" 
                               class="form-input" 
                               placeholder="••••••••"
                               required>
                        <div class="error-message" id="passwordConfirmationError"></div>
                    </div>
                    
                    <button type="submit" class="btn-auth btn-auth-primary">
                        Đặt lại mật khẩu
                        <span>→</span>
                    </button>
                </form>
                
                <div class="auth-footer-link">
                    <a th:href="@{/login}">Quay lại đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/auth.js}"></script>
</body>
</html>
