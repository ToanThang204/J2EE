<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách việc làm - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/footer.css}" rel="stylesheet">
    <link th:href="@{/css/shared/sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/employer/jobs.css}" rel="stylesheet">
    <link th:href="@{/css/cards.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="page-header">
                <h1>Danh sách việc làm</h1>
                <a th:href="@{/employer/jobs/create}" class="btn btn-primary">+ Đăng tin tuyển dụng</a>
            </div>
            
            <div th:if="${jobs != null and !jobs.isEmpty()}">
                <div th:each="job : ${jobs}" class="application-card" th:if="${job != null}">
                    <div class="application-card-header">
                        <div>
                            <h3 class="application-card-title" th:text="${job.title != null ? job.title : 'N/A'}">Job Title</h3>
                            <p class="application-card-company" th:if="${job.company != null}" th:text="${job.company.companyName}">Company Name</p>
                            <p class="application-card-company" th:if="${job.company == null}">N/A</p>
                            <p style="color: var(--medium-grey); font-size: var(--font-size-sm);" th:if="${job.location != null}" th:text="${'📍 ' + job.location}">Location</p>
                        </div>
                        <span class="status-badge" 
                              th:classappend="${job.status != null and job.status.name() == 'OPEN' ? 'approved' : 'pending'}"
                              th:text="${job.status != null and job.status.name() == 'OPEN' ? 'Đang tuyển' : 'Đã đóng'}">Đang tuyển</span>
                    </div>
                    <div class="application-card-footer">
                        <span class="application-date" th:if="${job.createdAt != null}" th:text="${'Đăng: ' + #temporals.format(job.createdAt, 'dd-MM-yyyy')}">Date</span>
                        <div class="action-buttons">
                            <button type="button" class="btn btn-secondary view-job" th:attr="data-job-id=${job.id}">Xem</button>
                            <a th:href="@{'/employer/jobs/' + ${job.id} + '/edit'}" class="btn btn-primary">Chỉnh sửa</a>
                            <button class="btn-icon delete" th:onclick="'deleteJob(' + ${job.id} + ')'" title="Xóa">🗑️</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${jobs == null or jobs.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">💼</div>
                <h3 class="empty-state-title">Chưa có việc làm nào</h3>
                <p class="empty-state-message">Bắt đầu đăng tin tuyển dụng để tìm ứng viên phù hợp!</p>
                <a th:href="@{/employer/jobs/create}" class="btn btn-primary">Đăng tin tuyển dụng ngay</a>
            </div>
        </main>
    </div>
    
    <!-- Job Detail Modal -->
    <div id="jobDetailModal" class="job-detail-modal" style="display:none;">
        <div class="job-detail-overlay"></div>
        <div class="job-detail-panel">
            <button class="job-detail-close" title="Đóng">×</button>
            <div class="job-detail-content">
                <h2 class="job-detail-title"></h2>
                <p class="job-detail-company"></p>
                <p class="job-detail-location"></p>
                <div class="job-detail-body"></div>
                <div class="job-detail-actions">
                    <a href="#" class="btn btn-primary job-detail-edit">Chỉnh sửa</a>
                    <button class="btn btn-secondary job-detail-close-btn">Đóng</button>
                </div>
            </div>
        </div>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
    <script th:src="@{/js/employer/jobs.js}"></script>
</body>
</html>
