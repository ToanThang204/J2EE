<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng tin tuyển dụng - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/forms.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="page-header">
                <h1>Đăng tin tuyển dụng</h1>
                <a href="/employer/jobs" class="btn btn-secondary">Quay lại</a>
            </div>
            
            <div class="card">
                <form id="jobForm" class="form-layout">
                    <input type="hidden" id="companyId" th:value="${company != null ? company.id : ''}">
                    
                    <div class="form-group">
                        <label class="form-label">Công ty</label>
                        <div class="form-input" style="background-color: #f5f5f5; color: #666; cursor: not-allowed;" readonly>
                            <span th:text="${company != null ? company.companyName : 'Chưa có công ty'}">Tên công ty</span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Tiêu đề <span class="required-indicator">*</span></label>
                        <input type="text" class="form-input" id="title" required placeholder="VD: Frontend Developer">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Mô tả công việc <span class="required-indicator">*</span></label>
                        <textarea class="form-input" id="description" rows="10" required placeholder="Mô tả chi tiết về công việc..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Yêu cầu</label>
                        <textarea class="form-input" id="requirements" rows="8" placeholder="Yêu cầu về kỹ năng, kinh nghiệm..."></textarea>
                    </div>
                    
                    <div class="form-layout two-columns">
                        <div class="form-group">
                            <label class="form-label">Địa điểm</label>
                            <input type="text" class="form-input" id="location" placeholder="VD: Hà Nội, TP.HCM">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Mức lương</label>
                            <input type="text" class="form-input" id="salaryRange" placeholder="VD: 10-20 triệu">
                        </div>
                    </div>
                    
                    <div class="form-layout two-columns">
                        <div class="form-group">
                            <label class="form-label">Loại hình</label>
                            <select class="form-input" id="employmentType">
                                <option value="">Chọn loại hình</option>
                                <option value="FULLTIME">Toàn thời gian</option>
                                <option value="PARTTIME">Bán thời gian</option>
                                <option value="CONTRACT">Hợp đồng</option>
                                <option value="INTERNSHIP">Thực tập</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Hạn nộp</label>
                            <input type="date" class="form-input" id="expirationDate">
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button type="submit" class="btn btn-primary">Đăng tin</button>
                        <a href="/employer/jobs" class="btn btn-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
    <script>
        document.getElementById('jobForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const companyId = document.getElementById('companyId').value;
            if (!companyId) {
                showToast('Không tìm thấy công ty. Vui lòng tạo công ty trước.', 'error');
                return;
            }
            
            // Xử lý expirationDate: thêm time nếu có giá trị
            const expirationDateValue = document.getElementById('expirationDate').value;
            const expirationDate = expirationDateValue ? expirationDateValue + 'T23:59:59' : null;
            
            const data = {
                company: {
                    id: parseInt(companyId)
                },
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                requirements: document.getElementById('requirements').value || '',
                location: document.getElementById('location').value || '',
                salaryRange: document.getElementById('salaryRange').value || '',
                employmentType: document.getElementById('employmentType').value || '',
                expirationDate: expirationDate,
                status: 'OPEN'
            };
            
            try {
                const response = await api.post('/jobs', data);
                if (response && response.success) {
                    showToast('Đăng tin tuyển dụng thành công', 'success');
                    setTimeout(() => {
                        window.location.href = '/employer/jobs';
                    }, 1000);
                } else {
                    showToast(response.message || 'Lỗi khi đăng tin', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Lỗi khi đăng tin', 'error');
            }
        });
    </script>
</body>
</html>
