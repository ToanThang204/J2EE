<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/forms.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="page-header">
                <h1>Hồ sơ của tôi</h1>
                <button class="btn btn-primary" onclick="editProfile()">Chỉnh sửa</button>
            </div>
            
            <div class="card">
                <div class="avatar-upload-container">
                    <div class="avatar-preview" th:if="${currentUser != null and currentUser.profile != null and currentUser.profile.avatar != null}">
                        <img th:src="${currentUser.profile.avatar}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
                    </div>
                    <div class="avatar-preview" th:if="${currentUser == null or currentUser.profile == null or currentUser.profile.avatar == null}">
                        <span th:text="${currentUser != null ? currentUser.name.substring(0, 1).toUpperCase() : 'U'}">U</span>
                    </div>
                </div>
                
                <div class="form-layout" style="margin-top: var(--spacing-xl);">
                    <div class="form-group">
                        <label class="form-label">Họ và tên</label>
                        <input type="text" class="form-input" th:value="${currentUser != null ? currentUser.name : ''}" readonly>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" th:value="${currentUser != null ? currentUser.email : ''}" readonly>
                    </div>
                    
                    <div class="form-group" th:if="${currentUser != null and currentUser.profile != null}">
                        <label class="form-label">Số điện thoại</label>
                        <input type="tel" class="form-input" th:value="${currentUser.profile.phone != null ? currentUser.profile.phone : 'Chưa cập nhật'}" readonly>
                    </div>
                    
                    <div class="form-group" th:if="${currentUser != null and currentUser.profile != null}">
                        <label class="form-label">Địa chỉ</label>
                        <input type="text" class="form-input" th:value="${currentUser.profile.address != null ? currentUser.profile.address : 'Chưa cập nhật'}" readonly>
                    </div>
                    
                    <div class="form-group" th:if="${currentUser != null and currentUser.profile != null}">
                        <label class="form-label">Giới thiệu</label>
                        <textarea class="form-input" rows="5" readonly th:text="${currentUser.profile.bio != null ? currentUser.profile.bio : 'Chưa cập nhật'}"></textarea>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
    <script>
        function editProfile() {
            window.location.href = '/employer/profile/edit';
        }
    </script>
</body>
</html>
