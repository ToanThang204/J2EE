<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${job != null ? 'Chỉnh sửa việc làm - WebCV' : 'Chỉnh sửa việc làm - WebCV'}">Chỉnh sửa việc làm - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/forms.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="page-header">
                <h1>Chỉnh sửa việc làm</h1>
                <a th:href="@{'/employer/jobs'}" class="btn btn-secondary">Quay lại</a>
            </div>
            
            <div class="card">
                <form id="jobForm" class="form-layout">
                    <input type="hidden" id="companyId" th:value="${company != null ? company.id : ''}">
                        <input type="hidden" id="jobId" th:value="${job != null ? job.id : ''}">
                    
                    <div class="form-group">
                        <label class="form-label">Công ty</label>
                        <div class="form-input" style="background-color: #f5f5f5; color: #666; cursor: not-allowed;" readonly>
                            <span th:text="${company != null ? company.companyName : 'Chưa có công ty'}">Tên công ty</span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Tiêu đề <span class="required-indicator">*</span></label>
                        <input type="text" class="form-input" id="title" required th:value="${job != null ? job.title : ''}">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Mô tả công việc <span class="required-indicator">*</span></label>
                        <textarea class="form-input" id="description" rows="10" required th:text="${job != null ? job.description : ''}"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Yêu cầu</label>
                        <textarea class="form-input" id="requirements" rows="8" th:text="${job != null ? job.requirements : ''}"></textarea>
                    </div>
                    
                    <div class="form-layout two-columns">
                        <div class="form-group">
                            <label class="form-label">Địa điểm</label>
                            <input type="text" class="form-input" id="location" th:value="${job != null ? job.location : ''}">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Mức lương</label>
                            <input type="text" class="form-input" id="salaryRange" th:value="${job != null ? job.salaryRange : ''}">
                        </div>
                    </div>
                    
                    <div class="form-layout two-columns">
                        <div class="form-group">
                            <label class="form-label">Loại hình</label>
                            <select class="form-input" id="employmentType">
                                <option value="">Chọn loại hình</option>
                                <option value="FULLTIME" th:selected="${job != null and job.employmentType == 'FULLTIME'}">Toàn thời gian</option>
                                <option value="PARTTIME" th:selected="${job != null and job.employmentType == 'PARTTIME'}">Bán thời gian</option>
                                <option value="CONTRACT" th:selected="${job != null and job.employmentType == 'CONTRACT'}">Hợp đồng</option>
                                <option value="INTERNSHIP" th:selected="${job != null and job.employmentType == 'INTERNSHIP'}">Thực tập</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Hạn nộp</label>
                            <input type="date" class="form-input" id="expirationDate" th:value="${job != null and job.expirationDate != null ? #temporals.format(job.expirationDate, 'yyyy-MM-dd') : ''}">
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button type="submit" class="btn btn-primary">Cập nhật</button>
                        <a th:href="@{'/employer/jobs'}" class="btn btn-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
    <script>
        document.getElementById('jobForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const jobId = document.getElementById('jobId') ? document.getElementById('jobId').value : null;
            if (!jobId) {
                showToast('Không tìm thấy việc làm', 'error');
                return;
            }
            
            const companyId = document.getElementById('companyId').value;
            if (!companyId) {
                showToast('Không tìm thấy công ty', 'error');
                return;
            }
            
            // Xử lý expirationDate: thêm time nếu có giá trị
            const expirationDateValue = document.getElementById('expirationDate').value;
            const expirationDate = expirationDateValue ? expirationDateValue + 'T23:59:59' : null;
            
            const data = {
                company: {
                    id: parseInt(companyId)
                },
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                requirements: document.getElementById('requirements').value || '',
                location: document.getElementById('location').value || '',
                salaryRange: document.getElementById('salaryRange').value || '',
                employmentType: document.getElementById('employmentType').value || '',
                expirationDate: expirationDate
            };
            
            try {
                const response = await api.put('/jobs/' + jobId, data);
                if (response && response.success) {
                    showToast('Cập nhật việc làm thành công', 'success');
                    setTimeout(() => {
                        window.location.href = '/employer/jobs';
                    }, 1000);
                } else {
                    showToast(response.message || 'Lỗi khi cập nhật', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Lỗi khi cập nhật', 'error');
            }
        });
    </script>
</body>
</html>
