<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nâng cấp lên Nhà tuyển dụng - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/footer.css}" rel="stylesheet">
    <link th:href="@{/css/forms.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
    <style>
        .upgrade-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }



        .upgrade-form-card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .form-section-header {
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-section-header h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-section-header p {
            color: #666;
            font-size: 14px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .form-field {
            position: relative;
        }

        .form-field.full-width {
            grid-column: 1 / -1;
        }

        .form-label-modern {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .form-label-modern .required-star {
            color: #e74c3c;
        }

        .form-label-modern .icon {
            margin-right: 6px;
        }

        .form-input-modern {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-input-modern:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-input-modern.error {
            border-color: #e74c3c;
        }

        textarea.form-input-modern {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .form-actions-modern {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        /* Logo Upload Styles */
        .logo-upload-container {
            margin-top: 10px;
        }

        .logo-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
        }

        .btn-remove-logo {
            padding: 8px 16px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-remove-logo:hover {
            background: #c0392b;
            transform: translateY(-1px);
        }

        .file-upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            border: 2px dashed #d0d0d0;
            border-radius: 12px;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-area:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .file-upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .file-upload-text {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .file-upload-hint {
            font-size: 13px;
            color: #999;
        }

        .btn-modern {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #666;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:hover {
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .upgrade-form-card {
                padding: 30px 20px;
            }

            .upgrade-hero {
                padding: 40px 20px;
            }

            .upgrade-hero h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>

    <div class="upgrade-container">


        <!-- Form Card -->
        <div class="upgrade-form-card">
            <div class="form-section-header">
                <h2>🏢 Thông tin công ty</h2>
                <p>Vui lòng cung cấp thông tin chi tiết về công ty của bạn</p>
            </div>

            <form id="upgradeForm">
                <div class="form-row">
                    <div class="form-field full-width">
                        <label for="companyName" class="form-label-modern">
                            <span class="icon">🏢</span>
                            Tên công ty <span class="required-star">*</span>
                        </label>
                        <input type="text" id="companyName" name="companyName" class="form-input-modern"
                            placeholder="VD: Công ty TNHH ABC" required>
                        <div class="error-message" id="companyNameError"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field full-width">
                        <label for="logo" class="form-label-modern">
                            <span class="icon">🎨</span>
                            Logo công ty
                        </label>
                        <div class="logo-upload-container">
                            <div class="logo-preview" id="logoPreview" style="display: none;">
                                <img id="logoPreviewImg" src="" alt="Logo preview"
                                    style="max-width: 200px; max-height: 200px; border-radius: 8px;">
                                <button type="button" class="btn-remove-logo" onclick="removeLogo()"
                                    style="margin-top: 10px;">✕ Xóa logo</button>
                            </div>
                            <div class="file-upload-area" id="logoUploadArea"
                                onclick="document.getElementById('logoInput').click()">
                                <div class="file-upload-icon">📷</div>
                                <div class="file-upload-text">Nhấn để chọn logo công ty</div>
                                <div class="file-upload-hint">PNG, JPG, GIF (Max 5MB)</div>
                            </div>
                            <input type="file" id="logoInput" name="logoFile" accept="image/*" style="display: none;"
                                onchange="handleLogoUpload(event)">
                        </div>
                        <div class="error-message" id="logoError"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field">
                        <label for="email" class="form-label-modern">
                            <span class="icon">📧</span>
                            Email công ty
                        </label>
                        <input type="email" id="email" name="email" class="form-input-modern"
                            placeholder="VD: contact@company.com">
                        <div class="error-message" id="emailError"></div>
                    </div>

                    <div class="form-field">
                        <label for="phone" class="form-label-modern">
                            <span class="icon">📞</span>
                            Số điện thoại
                        </label>
                        <input type="tel" id="phone" name="phone" class="form-input-modern"
                            placeholder="VD: 0123456789">
                        <div class="error-message" id="phoneError"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field full-width">
                        <label for="address" class="form-label-modern">
                            <span class="icon">📍</span>
                            Địa chỉ công ty <span class="required-star">*</span>
                        </label>
                        <input type="text" id="address" name="address" class="form-input-modern"
                            placeholder="VD: 123 Nguyễn Huệ, Quận 1, TP.HCM" required>
                        <div class="error-message" id="addressError"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field full-width">
                        <label for="website" class="form-label-modern">
                            <span class="icon">🌐</span>
                            Website
                        </label>
                        <input type="url" id="website" name="website" class="form-input-modern"
                            placeholder="VD: https://congty.com">
                        <div class="error-message" id="websiteError"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-field full-width">
                        <label for="description" class="form-label-modern">
                            <span class="icon">📝</span>
                            Mô tả về công ty <span class="required-star">*</span>
                        </label>
                        <textarea id="description" name="description" class="form-input-modern"
                            placeholder="Mô tả ngắn gọn về công ty, lĩnh vực hoạt động, văn hóa làm việc..."
                            required></textarea>
                        <div class="error-message" id="descriptionError"></div>
                    </div>
                </div>

                <div class="form-actions-modern">
                    <a th:href="@{/}" class="btn-modern btn-cancel">
                        ✕ Hủy
                    </a>
                    <button type="submit" class="btn-modern btn-submit">
                        <span class="btn-text">🚀 Nâng cấp tài khoản</span>
                        <span class="btn-loading" style="display: none;">⏳ Đang xử lý...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>

    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/employer/upgrade.js}"></script>
</body>

</html>
