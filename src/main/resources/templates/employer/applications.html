<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý ứng tuyển - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/footer.css}" rel="stylesheet">
    <link th:href="@{/css/shared/sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/cards.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
    <style>
        .application-card{background:#fff;border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.04)}
        .status-badge{padding:6px 10px;border-radius:16px;font-weight:600}
    </style>
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        <main class="main-content with-sidebar">
            <div class="page-header">
                <h1>Quản lý đơn ứng tuyển</h1>
            </div>

            <div class="card">
                <div class="section-header-flex">
                    <h2 class="section-title">Danh sách yêu cầu ứng tuyển</h2>
                    <div class="action-buttons">
                        <select id="companySelect" class="form-input">
                            <option value="">Chọn công ty</option>
                            <th:block th:each="c : ${companies}">
                                <option th:value="${c.id}" th:text="${c.companyName}"></option>
                            </th:block>
                        </select>
                        <button id="btnRefresh" class="btn btn-primary">Làm mới</button>
                    </div>
                </div>

                <div id="applicationsContainer" class="card-body">
                    <div id="appsLoading">Đang tải...</div>
                    <div id="appsList"></div>
                </div>
            </div>
        </main>
    </div>
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>

    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
    <script th:src="@{/js/employer/manage-applications.js}"></script>
</body>
</html>
