<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn ứng tuyển - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/footer.css}" rel="stylesheet">
    <link th:href="@{/css/shared/sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/employer/manage-applications.css}" rel="stylesheet">
    <link th:href="@{/css/cards.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="page-header">
                <h1>Quản lý đơn ứng tuyển</h1>
            </div>
            
            <div class="card">
                <div class="section-header-flex">
                    <h2 class="section-title">Tất cả đơn ứng tuyển</h2>
                    <div class="action-buttons">
                        <input type="text" id="searchInput" class="form-input" placeholder="Tìm kiếm..." style="max-width: 300px;">
                        <button class="btn btn-primary" onclick="searchApplications()">Tìm kiếm</button>
                    </div>
                </div>
                
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Ứng viên</th>
                                <th>Việc làm</th>
                                <th>Công ty</th>
                                <th>Trạng thái</th>
                                <th>Ngày ứng tuyển</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="app : ${applications}">
                                <td th:text="${app.user != null ? app.user.name : 'N/A'}">Candidate Name</td>
                                <td th:text="${app.job != null ? app.job.title : 'N/A'}">Job Title</td>
                                <td th:text="${app.job != null and app.job.company != null ? app.job.company.companyName : 'N/A'}">Company Name</td>
                                <td>
                                    <span class="status-badge" 
                                          th:classappend="${app.status != null ? app.status.name().toLowerCase() : ''}"
                                          th:text="${app.status != null ? app.status.name() : 'N/A'}">Status</span>
                                </td>
                                <td th:text="${app.createdAt != null ? #temporals.format(app.createdAt, 'dd-MM-yyyy') : 'N/A'}">01-01-2024</td>
                                <td>
                                    <div class="action-cell">
                                        <button class="btn btn-primary" onclick="viewApplication(/*[[${app.id}]]*/)">Xem</button>
                                        <button class="btn btn-secondary" onclick="updateStatus(/*[[${app.id}]]*/)">Cập nhật</button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${applications == null or applications.isEmpty()}">
                                <td colspan="6" class="empty-state">
                                    <div class="empty-state-icon">📋</div>
                                    <p class="empty-state-message">Chưa có đơn ứng tuyển nào</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/application.js}"></script>
    <script th:src="@{/js/employer/manage-applications.js}"></script>
</body>
</html>
