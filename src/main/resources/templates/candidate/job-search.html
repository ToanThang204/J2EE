<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm kiếm việc làm - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/footer.css}" rel="stylesheet">
    <link th:href="@{/css/shared/sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/roles/candidate/job-search.css}" rel="stylesheet">
    <link th:href="@{/css/cards.css}" rel="stylesheet">
    <link th:href="@{/css/forms.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="page-header">
                <h1>Tìm kiếm việc làm</h1>
            </div>
            
            <div class="search-filter-section">
                <div class="search-box">
                    <div class="search-input-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" 
                               id="searchInput" 
                               class="form-input" 
                               placeholder="Tìm kiếm theo tiêu đề, công ty, địa điểm...">
                    </div>
                    <button class="btn btn-primary" onclick="searchJobs()">Tìm kiếm</button>
                </div>
                
                <div class="filter-box">
                    <div class="filter-group">
                        <label>Danh mục</label>
                        <select id="categoryFilter" class="form-input">
                            <option value="">Tất cả danh mục</option>
                            <!-- Categories will be populated from backend -->
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label>Địa điểm</label>
                        <input type="text" id="locationFilter" class="form-input" placeholder="VD: Hà Nội, TP.HCM">
                    </div>
                    
                    <div class="filter-group">
                        <label>Mức lương</label>
                        <select id="salaryFilter" class="form-input">
                            <option value="">Tất cả</option>
                            <option value="0-5">Dưới 5 triệu</option>
                            <option value="5-10">5-10 triệu</option>
                            <option value="10-20">10-20 triệu</option>
                            <option value="20-50">20-50 triệu</option>
                            <option value="50+">Trên 50 triệu</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="jobs-grid" id="jobsGrid">
                <!-- Jobs will be populated here -->
            </div>
            
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-state-icon">💼</div>
                <h3 class="empty-state-title">Không tìm thấy việc làm nào</h3>
                <p class="empty-state-message">Hãy thử tìm kiếm với từ khóa khác hoặc điều chỉnh bộ lọc.</p>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/candidate/job-search.js}"></script>
</body>
</html>
