<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách CV - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/footer.css}" rel="stylesheet">
    <link th:href="@{/css/shared/sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/roles/candidate/cv-index.css}" rel="stylesheet">
    <link th:href="@{/css/cards.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="page-header">
                <h1>Danh sách CV</h1>
                <a th:href="@{/candidate/cv-builder}" class="btn btn-primary">+ Tạo CV mới</a>
            </div>
            
            <div th:if="${resumes != null and !resumes.isEmpty()}">
                <div th:each="resume : ${resumes}" class="resume-card" th:onclick="'window.location.href=\'/candidate/resumes/\' + ${resume.id}">
                    <div class="resume-card-header">
                        <div>
                            <h3 class="resume-card-title" th:text="${resume.title != null ? resume.title : 'CV chưa có tiêu đề'}">Resume Title</h3>
                            <p class="resume-card-meta" th:text="${resume.updatedAt != null ? 'Cập nhật: ' + ${#temporals.format(resume.updatedAt, 'dd-MM-yyyy')} : ''}">Updated date</p>
                        </div>
                        <div class="resume-card-actions" onclick="event.stopPropagation()">
                            <button class="btn-icon edit" onclick="editResume(/*[[${resume.id}]]*/)" title="Chỉnh sửa">✏️</button>
                            <button class="btn-icon delete" onclick="deleteResume(/*[[${resume.id}]]*/)" title="Xóa">🗑️</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${resumes == null or resumes.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">📄</div>
                <h3 class="empty-state-title">Chưa có CV nào</h3>
                <p class="empty-state-message">Tạo CV đầu tiên của bạn để bắt đầu ứng tuyển!</p>
                <a th:href="@{/candidate/cv-builder}" class="btn btn-primary">Tạo CV ngay</a>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/candidate/cv-management.js}"></script>
</body>
</html>
