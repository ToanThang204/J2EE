<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin nhắn - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/footer.css}" rel="stylesheet">
    <link th:href="@{/css/shared/sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .chat-container {
            display: flex;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            height: calc(100vh - 250px);
            min-height: 500px;
            overflow: hidden;
            border: 1px solid #edf2f7;
        }

        .chat-sidebar {
            width: 320px;
            border-right: 1px solid #edf2f7;
            display: flex;
            flex-direction: column;
        }

        .chat-sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #edf2f7;
            font-weight: 700;
            color: #2d3748;
            font-size: 18px;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 15px 20px;
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 4px solid transparent;
        }

        .conversation-item:hover {
            background: #f8fafc;
        }

        .conversation-item.active {
            background: #f0fdf4;
            border-left-color: #5cb85c;
        }

        .conversation-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #718096;
            flex-shrink: 0;
            position: relative;
        }

        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #5cb85c;
            border: 2px solid white;
            border-radius: 50%;
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
        }

        .conversation-name {
            font-weight: 600;
            color: #2d3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .last-time {
            font-size: 11px;
            font-weight: 400;
            color: #a0aec0;
        }

        .last-msg {
            font-size: 13px;
            color: #718096;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .chat-header {
            padding: 15px 25px;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-body {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
        }

        .message.sent {
            align-self: flex-end;
            background: #5cb85c;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: white;
            color: #2d3748;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .chat-footer {
            padding: 20px;
            border-top: 1px solid #edf2f7;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            border: 1px solid #e2e8f0;
            padding: 12px 20px;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #5cb85c;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #5cb85c;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: #4cae4c;
        }

        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #a0aec0;
            background: #f8fafc;
        }
    </style>
</head>

<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>

    <div class="main-container" style="background-color: #f5f7fa; min-height: calc(100vh - 80px);">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>

        <main class="main-content with-sidebar" style="padding: 30px;">
            <div class="section-title-bar"
                style="background: #5cb85c; color: white; padding: 12px 20px; border-radius: 4px; margin-bottom: 24px; font-weight: 500;">
                Tin nhắn & Trò chuyện
            </div>

            <div class="chat-container">
                <div class="chat-sidebar">
                    <div class="chat-sidebar-header">Đoạn hội thoại</div>
                    <div class="conversation-list" id="conversationList">
                        <!-- Placeholder -->
                        <div style="padding: 40px 20px; text-align: center; color: #a0aec0;">
                            <i class="fas fa-comments" style="font-size: 40px; margin-bottom: 10px;"></i>
                            <p style="font-size: 14px;">Chưa có hội thoại nào</p>
                        </div>
                    </div>
                </div>

                <div class="chat-main" id="chatMain">
                    <div class="empty-chat">
                        <i class="fas fa-paper-plane" style="font-size: 60px; margin-bottom: 20px;"></i>
                        <h3>Chọn một cuộc trò chuyện để bắt đầu</h3>
                        <p>Kết nối với nhà tuyển dụng để tìm kiếm cơ hội!</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>

    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/shared/sidebar.js}"></script>
</body>

</html>
