<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt - WebCV</title>
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/shared/header.css}" rel="stylesheet">
    <link th:href="@{/css/shared/footer.css}" rel="stylesheet">
    <link th:href="@{/css/shared/sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
    <link th:href="@{/css/roles/candidate/settings.css}" rel="stylesheet">
    <link th:href="@{/css/forms.css}" rel="stylesheet">
    <link th:href="@{/css/responsive.css}" rel="stylesheet">
    <link th:href="@{/css/animations.css}" rel="stylesheet">
</head>
<body>
    <header th:replace="~{layout/fragments/header :: header}"></header>
    
    <div class="main-container">
        <aside th:replace="~{layout/fragments/sidebar :: sidebar}"></aside>
        
        <main class="main-content with-sidebar">
            <div class="page-header">
                <h1>Cài đặt</h1>
            </div>
            
            <div class="tabs">
                <button class="tab active" onclick="showTab('account')">Tài khoản</button>
                <button class="tab" onclick="showTab('notifications')">Thông báo</button>
                <button class="tab" onclick="showTab('privacy')">Bảo mật</button>
            </div>
            
            <div id="accountTab" class="tab-content active">
                <div class="card">
                    <h2 class="section-title">Thông tin tài khoản</h2>
                    <form id="accountForm" class="form-layout">
                        <div class="form-group">
                            <label class="form-label">Họ và tên</label>
                            <input type="text" class="form-input" id="name" th:value="${currentUser != null ? currentUser.name : ''}" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-input" id="email" th:value="${currentUser != null ? currentUser.email : ''}" readonly>
                        </div>
                        
                        <div class="action-buttons">
                            <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                        </div>
                    </form>
                </div>
                
                <div class="card" style="margin-top: var(--spacing-lg);">
                    <h2 class="section-title">Đổi mật khẩu</h2>
                    <form id="passwordForm" class="form-layout">
                        <div class="form-group">
                            <label class="form-label">Mật khẩu hiện tại</label>
                            <input type="password" class="form-input" id="currentPassword" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Mật khẩu mới</label>
                            <input type="password" class="form-input" id="newPassword" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Xác nhận mật khẩu mới</label>
                            <input type="password" class="form-input" id="confirmPassword" required>
                        </div>
                        
                        <div class="action-buttons">
                            <button type="submit" class="btn btn-primary">Đổi mật khẩu</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <div id="notificationsTab" class="tab-content">
                <div class="card">
                    <h2 class="section-title">Cài đặt thông báo</h2>
                    <form id="notificationSettingsForm" class="form-layout">
                        <div class="form-group">
                            <label class="form-label">
                                <input type="checkbox" id="emailNotifications" checked> Nhận thông báo qua email
                            </label>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <input type="checkbox" id="jobAlerts" checked> Cảnh báo việc làm mới
                            </label>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <input type="checkbox" id="applicationUpdates" checked> Cập nhật đơn ứng tuyển
                            </label>
                        </div>
                        
                        <div class="action-buttons">
                            <button type="submit" class="btn btn-primary">Lưu cài đặt</button>
                        </div>
                    </form>
                </div>
            </div>
            
            <div id="privacyTab" class="tab-content">
                <div class="card">
                    <h2 class="section-title">Cài đặt bảo mật</h2>
                    <form id="privacySettingsForm" class="form-layout">
                        <div class="form-group">
                            <label class="form-label">
                                <input type="checkbox" id="profileVisibility" checked> Hiển thị hồ sơ công khai
                            </label>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">
                                <input type="checkbox" id="allowMessages"> Cho phép nhận tin nhắn từ nhà tuyển dụng
                            </label>
                        </div>
                        
                        <div class="action-buttons">
                            <button type="submit" class="btn btn-primary">Lưu cài đặt</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
    
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/utils.js}"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/shared/header.js}"></script>
    <script th:src="@{/js/candidate/settings.js}"></script>
</body>
</html>
