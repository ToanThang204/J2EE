spring.application.name=recruitment-system
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:sqlserver://ADMIN-PC\\SQLEXPRESS;databaseName=J2EECV;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# File Upload Configuration (for CV and images)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Configuration
application.reapply.cooldown.minutes=5

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}

# Sepay API Configuration (Payment Gateway)
sepay.secret.key=${SEPAY_SECRET_KEY}
sepay.merchant.id=${SEPAY_MERCHANT_ID}
sepay.api.url=https://my.sepay.vn/userapi
sepay.qr.base.url=https://qr.sepay.vn/img
sepay.bank.code=BIDV
sepay.account.number=${SEPAY_ACCOUNT_NUMBER}
sepay.account.name=Phạm Quang Hiếu

# Google OAuth2 Configuration
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=https://hocphi.vn/auth/google/callback

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000